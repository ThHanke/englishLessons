<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Simple Past — Daily Routines</title>
<style>
  body { font-family: sans-serif; max-width: 40rem; margin: 2rem auto; }
  input { border: 1px solid #888; padding: 0.2rem 0.4rem; }
  input.correct { background: #d4f7d4; border-color: #2a2; }
  input.incorrect { background: #f7d4d4; border-color: #a22; }
  .hint { color: #666; font-style: italic; }
  button { margin-top: 1rem; }
</style>
</head>
<body>
<h1>Simple Past — Daily Routines</h1>
<p class="sentence" data-item="0">Mia <input type="text" data-item="0" data-blank="0" autocomplete="off"> <span class="hint">(wake)</span> up at seven o'clock.</p>
<p class="sentence" data-item="1">She <input type="text" data-item="1" data-blank="0" autocomplete="off"> <span class="hint">(have)</span> breakfast with her family.</p>
<p class="sentence" data-item="2">They <input type="text" data-item="2" data-blank="0" autocomplete="off"> <span class="hint">(eat)</span> toast for breakfast.</p>
<p class="sentence" data-item="3">Mia <input type="text" data-item="3" data-blank="0" autocomplete="off"> <span class="hint">(catch)</span> the bus to school.</p>
<p class="sentence" data-item="4">She <input type="text" data-item="4" data-blank="0" autocomplete="off"> <span class="hint">(come)</span> home after school.</p>
<p class="sentence" data-item="5">In the evening, she <input type="text" data-item="5" data-blank="0" autocomplete="off"> <span class="hint">(go)</span> to bed at nine o'clock.</p>
<button id="check">Check</button>
<script>
(function () {
  var answers = [["woke"],["had"],["ate"],["caught"],["came"],["went"]];
  function normalize(s) { return s.trim().toLowerCase(); }
  document.getElementById('check').addEventListener('click', function () {
    var inputs = document.querySelectorAll('input[data-item]');
    inputs.forEach(function (input) {
      var ii = Number(input.getAttribute('data-item'));
      var bi = Number(input.getAttribute('data-blank'));
      var value = input.value.trim();
      input.classList.remove('correct', 'incorrect');
      if (value.length === 0) return;
      if (normalize(value) === normalize(answers[ii][bi])) {
        input.classList.add('correct');
      } else {
        input.classList.add('incorrect');
      }
    });
  });
})();
</script>
</body>
</html>
