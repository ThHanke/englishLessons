<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Passive Voice: Back in School</title>
<style>
  body { font-family: sans-serif; max-width: 40rem; margin: 2rem auto; }
  input { border: 1px solid #888; padding: 0.2rem 0.4rem; }
  input.correct { background: #d4f7d4; border-color: #2a2; }
  input.incorrect { background: #f7d4d4; border-color: #a22; }
  button { margin-top: 1rem; }
</style>
</head>
<body>
<h1>Passive Voice: Back in School</h1>
<p id="sentence">On the first day of school, the new timetable <input type="text" data-blank="0" autocomplete="off"> to every student. Homework <input type="text" data-blank="1" autocomplete="off"> by the teacher every week, and the classroom <input type="text" data-blank="2" autocomplete="off"> every morning before lessons start.</p>
<button id="check">Check</button>
<script>
(function () {
  var answers = ["is given","is checked","is cleaned"];
  function normalize(s) { return s.trim().toLowerCase(); }
  document.getElementById('check').addEventListener('click', function () {
    var inputs = document.querySelectorAll('input[data-blank]');
    inputs.forEach(function (input) {
      var idx = Number(input.getAttribute('data-blank'));
      var value = input.value.trim();
      input.classList.remove('correct', 'incorrect');
      if (value.length === 0) return;
      if (normalize(value) === normalize(answers[idx])) {
        input.classList.add('correct');
      } else {
        input.classList.add('incorrect');
      }
    });
  });
})();
</script>
</body>
</html>
