<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>School conversation -- fill in the phrases (Band 1)</title>
<style>
  body { font-family: sans-serif; max-width: 40rem; margin: 2rem auto; }
  input { border: 1px solid #888; padding: 0.2rem 0.4rem; }
  input.correct { background: #d4f7d4; border-color: #2a2; }
  input.incorrect { background: #f7d4d4; border-color: #a22; }
  .hint { color: #666; font-style: italic; }
  button { margin-top: 1rem; }
</style>
</head>
<body>
<h1>School conversation -- fill in the phrases (Band 1)</h1>
<p class="sentence" data-item="0"><input type="text" data-item="0" data-blank="0" autocomplete="off"> <span class="hint">(informal opener)</span>, did you have a good summer?</p>
<p class="sentence" data-item="1">Hi! Can I <input type="text" data-item="1" data-blank="0" autocomplete="off"> <span class="hint">(ask)</span> you something?</p>
<p class="sentence" data-item="2"><input type="text" data-item="2" data-blank="0" autocomplete="off"> <span class="hint">(showing surprise or interest)</span>! Tell me more!</p>
<p class="sentence" data-item="3">What do you <input type="text" data-item="3" data-blank="0" autocomplete="off"> <span class="hint">(mean)</span> exactly?</p>
<p class="sentence" data-item="4">OK, I have to go. <input type="text" data-item="4" data-blank="0" autocomplete="off"> <span class="hint">(see)</span> you later!</p>
<button id="check">Check</button>
<script>
(function () {
  var answers = [["Hey"],["ask"],["Really"],["mean"],["See"]];
  function normalize(s) { return s.trim().toLowerCase(); }
  document.getElementById('check').addEventListener('click', function () {
    var inputs = document.querySelectorAll('input[data-item]');
    inputs.forEach(function (input) {
      var ii = Number(input.getAttribute('data-item'));
      var bi = Number(input.getAttribute('data-blank'));
      var value = input.value.trim();
      input.classList.remove('correct', 'incorrect');
      if (value.length === 0) return;
      if (normalize(value) === normalize(answers[ii][bi])) {
        input.classList.add('correct');
      } else {
        input.classList.add('incorrect');
      }
    });
  });
})();
</script>
</body>
</html>
