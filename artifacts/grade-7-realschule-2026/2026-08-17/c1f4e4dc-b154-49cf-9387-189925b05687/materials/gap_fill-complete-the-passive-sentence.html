<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Complete the Passive Sentence</title>
<style>
  body { font-family: sans-serif; max-width: 40rem; margin: 2rem auto; }
  input { border: 1px solid #888; padding: 0.2rem 0.4rem; }
  input.correct { background: #d4f7d4; border-color: #2a2; }
  input.incorrect { background: #f7d4d4; border-color: #a22; }
  .hint { color: #666; font-style: italic; }
  button { margin-top: 1rem; }
</style>
</head>
<body>
<h1>Complete the Passive Sentence</h1>
<p class="sentence" data-item="0">The whiteboard <input type="text" data-item="0" data-blank="0" autocomplete="off"> <span class="hint">(clean)</span> every day.</p>
<p class="sentence" data-item="1">New books <input type="text" data-item="1" data-blank="0" autocomplete="off"> <span class="hint">(give)</span> to all students at the start of the year.</p>
<p class="sentence" data-item="2">The music room <input type="text" data-item="2" data-blank="0" autocomplete="off"> <span class="hint">(use)</span> for band practice.</p>
<p class="sentence" data-item="3">Homework <input type="text" data-item="3" data-blank="0" autocomplete="off"> <span class="hint">(check)</span> on Mondays.</p>
<p class="sentence" data-item="4">Science experiments <input type="text" data-item="4" data-blank="0" autocomplete="off"> <span class="hint">(do)</span> in the lab.</p>
<p class="sentence" data-item="5">School rules <input type="text" data-item="5" data-blank="0" autocomplete="off"> <span class="hint">(explain)</span> at the start of the year.</p>
<button id="check">Check</button>
<script>
(function () {
  var answers = [["is cleaned"],["are given"],["is used"],["is checked"],["are done"],["are explained"]];
  function normalize(s) { return s.trim().toLowerCase(); }
  document.getElementById('check').addEventListener('click', function () {
    var inputs = document.querySelectorAll('input[data-item]');
    inputs.forEach(function (input) {
      var ii = Number(input.getAttribute('data-item'));
      var bi = Number(input.getAttribute('data-blank'));
      var value = input.value.trim();
      input.classList.remove('correct', 'incorrect');
      if (value.length === 0) return;
      if (normalize(value) === normalize(answers[ii][bi])) {
        input.classList.add('correct');
      } else {
        input.classList.add('incorrect');
      }
    });
  });
})();
</script>
</body>
</html>
