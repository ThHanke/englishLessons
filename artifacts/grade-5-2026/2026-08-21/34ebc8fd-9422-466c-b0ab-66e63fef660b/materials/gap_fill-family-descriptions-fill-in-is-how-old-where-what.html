<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Family descriptions -- fill in is, How old, Where, What</title>
<style>
  body { font-family: sans-serif; max-width: 40rem; margin: 2rem auto; }
  input { border: 1px solid #888; padding: 0.2rem 0.4rem; }
  input.correct { background: #d4f7d4; border-color: #2a2; }
  input.incorrect { background: #f7d4d4; border-color: #a22; }
  .hint { color: #666; font-style: italic; }
  button { margin-top: 1rem; }
</style>
</head>
<body>
<h1>Family descriptions -- fill in is, How old, Where, What</h1>
<p class="sentence" data-item="0">She <input type="text" data-item="0" data-blank="0" autocomplete="off"> <span class="hint">(is)</span> my sister.</p>
<p class="sentence" data-item="1">Her name <input type="text" data-item="1" data-blank="0" autocomplete="off"> <span class="hint">(is)</span> Lena.</p>
<p class="sentence" data-item="2"><input type="text" data-item="2" data-blank="0" autocomplete="off"> <span class="hint">(How old)</span> is your brother? He is 12.</p>
<p class="sentence" data-item="3"><input type="text" data-item="3" data-blank="0" autocomplete="off"> <span class="hint">(Where)</span> is she from? She is from Berlin.</p>
<p class="sentence" data-item="4">This is my mother. She <input type="text" data-item="4" data-blank="0" autocomplete="off"> <span class="hint">(is)</span> a teacher.</p>
<p class="sentence" data-item="5"><input type="text" data-item="5" data-blank="0" autocomplete="off"> <span class="hint">(What)</span> is his name? His name is Tom.</p>
<button id="check">Check</button>
<script>
(function () {
  var answers = [["is"],["is"],["How old"],["Where"],["is"],["What"]];
  function normalize(s) { return s.trim().toLowerCase(); }
  document.getElementById('check').addEventListener('click', function () {
    var inputs = document.querySelectorAll('input[data-item]');
    inputs.forEach(function (input) {
      var ii = Number(input.getAttribute('data-item'));
      var bi = Number(input.getAttribute('data-blank'));
      var value = input.value.trim();
      input.classList.remove('correct', 'incorrect');
      if (value.length === 0) return;
      if (normalize(value) === normalize(answers[ii][bi])) {
        input.classList.add('correct');
      } else {
        input.classList.add('incorrect');
      }
    });
  });
})();
</script>
</body>
</html>
