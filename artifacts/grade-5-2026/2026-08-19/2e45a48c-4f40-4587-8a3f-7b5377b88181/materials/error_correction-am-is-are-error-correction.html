<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Am, Is, Are — Error Correction</title>
<style>
  body { font-family: sans-serif; max-width: 40rem; margin: 2rem auto; }
  fieldset.item { border: 1px solid #ccc; border-radius: 0.4rem; margin-bottom: 1.5rem; padding: 1rem; }
  legend { font-weight: bold; padding: 0 0.4rem; }
  label { display: block; margin-top: 0.6rem; }
  input[type="text"] { display: block; width: 100%; margin-top: 0.2rem; border: 1px solid #888; padding: 0.3rem 0.5rem; box-sizing: border-box; }
  input.correct { background: #d4f7d4; border-color: #2a2; }
  input.incorrect { background: #f7d4d4; border-color: #a22; }
  .error-type-hint { font-weight: normal; font-style: italic; color: #666; }
  button.check { margin-top: 0.8rem; }
  p.result { font-weight: bold; min-height: 1.2em; }
  p.result.correct { color: #2a2; }
  p.result.incorrect { color: #a22; }
  p.result.unanswered { color: #666; }
</style>
</head>
<body>
<h1>Am, Is, Are — Error Correction</h1>

    <fieldset class="item" data-item="0">
      <legend>My name is Ben. I are ten years old.</legend>
      <label>Find the mistake: what word(s) are wrong? <span class="error-type-hint">(hint: verb form)</span>
        <input type="text" data-find="0" autocomplete="off">
      </label>
      <label>Explain: why is this wrong?
        <input type="text" data-explain="0" autocomplete="off">
      </label>
      <label>Correct: write the full corrected sentence.
        <input type="text" data-correct="0" autocomplete="off">
      </label>
      <button type="button" class="check" data-item="0">Check</button>
      <p class="result" data-result="0"></p>
    </fieldset>
    <fieldset class="item" data-item="1">
      <legend>This is my friend. She am from England.</legend>
      <label>Find the mistake: what word(s) are wrong? <span class="error-type-hint">(hint: verb form)</span>
        <input type="text" data-find="1" autocomplete="off">
      </label>
      <label>Explain: why is this wrong?
        <input type="text" data-explain="1" autocomplete="off">
      </label>
      <label>Correct: write the full corrected sentence.
        <input type="text" data-correct="1" autocomplete="off">
      </label>
      <button type="button" class="check" data-item="1">Check</button>
      <p class="result" data-result="1"></p>
    </fieldset>
    <fieldset class="item" data-item="2">
      <legend>What is you name?</legend>
      <label>Find the mistake: what word(s) are wrong? <span class="error-type-hint">(hint: pronoun)</span>
        <input type="text" data-find="2" autocomplete="off">
      </label>
      <label>Explain: why is this wrong?
        <input type="text" data-explain="2" autocomplete="off">
      </label>
      <label>Correct: write the full corrected sentence.
        <input type="text" data-correct="2" autocomplete="off">
      </label>
      <button type="button" class="check" data-item="2">Check</button>
      <p class="result" data-result="2"></p>
    </fieldset>
    <fieldset class="item" data-item="3">
      <legend>How old is you?</legend>
      <label>Find the mistake: what word(s) are wrong? <span class="error-type-hint">(hint: verb form)</span>
        <input type="text" data-find="3" autocomplete="off">
      </label>
      <label>Explain: why is this wrong?
        <input type="text" data-explain="3" autocomplete="off">
      </label>
      <label>Correct: write the full corrected sentence.
        <input type="text" data-correct="3" autocomplete="off">
      </label>
      <button type="button" class="check" data-item="3">Check</button>
      <p class="result" data-result="3"></p>
    </fieldset>
    <fieldset class="item" data-item="4">
      <legend>I is from Germany.</legend>
      <label>Find the mistake: what word(s) are wrong? <span class="error-type-hint">(hint: verb form)</span>
        <input type="text" data-find="4" autocomplete="off">
      </label>
      <label>Explain: why is this wrong?
        <input type="text" data-explain="4" autocomplete="off">
      </label>
      <label>Correct: write the full corrected sentence.
        <input type="text" data-correct="4" autocomplete="off">
      </label>
      <button type="button" class="check" data-item="4">Check</button>
      <p class="result" data-result="4"></p>
    </fieldset>
<script>
(function () {
  var corrections = ["My name is Ben. I am ten years old.","This is my friend. She is from England.","What is your name?","How old are you?","I am from Germany."];
  function normalize(s) { return s.trim().toLowerCase().replace(/\s+/g, ' '); }

  document.querySelectorAll('button.check').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var ii = Number(btn.getAttribute('data-item'));
      var correctInput = document.querySelector('input[data-correct="' + ii + '"]');
      var resultEl = document.querySelector('[data-result="' + ii + '"]');
      var value = correctInput.value.trim();
      correctInput.classList.remove('correct', 'incorrect');
      if (value.length === 0) {
        resultEl.textContent = 'Unanswered';
        resultEl.className = 'result unanswered';
        return;
      }
      if (normalize(value) === normalize(corrections[ii])) {
        resultEl.textContent = 'Correct';
        resultEl.className = 'result correct';
        correctInput.classList.add('correct');
      } else {
        resultEl.textContent = 'Incorrect';
        resultEl.className = 'result incorrect';
        correctInput.classList.add('incorrect');
      }
    });
  });
})();
</script>
</body>
</html>
