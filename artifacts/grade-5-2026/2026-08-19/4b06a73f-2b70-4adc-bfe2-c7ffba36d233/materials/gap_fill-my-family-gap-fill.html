<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My Family — gap fill</title>
<style>
  body { font-family: sans-serif; max-width: 40rem; margin: 2rem auto; }
  input { border: 1px solid #888; padding: 0.2rem 0.4rem; }
  input.correct { background: #d4f7d4; border-color: #2a2; }
  input.incorrect { background: #f7d4d4; border-color: #a22; }
  .hint { color: #666; font-style: italic; }
  button { margin-top: 1rem; }
</style>
</head>
<body>
<h1>My Family — gap fill</h1>
<p class="sentence" data-item="0">This is my <input type="text" data-item="0" data-blank="0" autocomplete="off"> <span class="hint">(Schwester)</span> Anna. She is 8 years old.</p>
<p class="sentence" data-item="1">My <input type="text" data-item="1" data-blank="0" autocomplete="off"> <span class="hint">(Papa)</span> is 40 years old. He is from Berlin.</p>
<p class="sentence" data-item="2">I <input type="text" data-item="2" data-blank="0" autocomplete="off"> <span class="hint">(bin)</span> 10 years old. I am from Leipzig.</p>
<p class="sentence" data-item="3">This is my <input type="text" data-item="3" data-blank="0" autocomplete="off"> <span class="hint">(Oma)</span>. She is my mum's mum.</p>
<p class="sentence" data-item="4">My brother Tom <input type="text" data-item="4" data-blank="0" autocomplete="off"> <span class="hint">(ist)</span> 12 years old. He is funny.</p>
<button id="check">Check</button>
<script>
(function () {
  var answers = [["sister"],["dad"],["am"],["grandma"],["is"]];
  function normalize(s) { return s.trim().toLowerCase(); }
  document.getElementById('check').addEventListener('click', function () {
    var inputs = document.querySelectorAll('input[data-item]');
    inputs.forEach(function (input) {
      var ii = Number(input.getAttribute('data-item'));
      var bi = Number(input.getAttribute('data-blank'));
      var value = input.value.trim();
      input.classList.remove('correct', 'incorrect');
      if (value.length === 0) return;
      if (normalize(value) === normalize(answers[ii][bi])) {
        input.classList.add('correct');
      } else {
        input.classList.add('incorrect');
      }
    });
  });
})();
</script>
</body>
</html>
