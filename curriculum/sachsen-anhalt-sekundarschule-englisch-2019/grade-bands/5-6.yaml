        source: { doc: lehrplan-2019, location: l201 }
        used_in: [module_construction, lesson_planning]
  methodisch:
    - id: m.textrezeption.1
      text: "erste Texterschließungsstrategien (titles, keywords, marking) anwenden"
      source: { doc: lehrplan-2019, location: l207 }
      used_in: [lesson_planning, base_material]
    - id: m.textrezeption.2
      text: "grundlegende Techniken im Umgang mit dem zweisprachigen Wörterbuch anwenden (z. B. Lexik auffinden, Aussprache entnehmen, Wortarten erkennen, Symbole entschlüsseln)"
      source: { doc: lehrplan-2019, location: l207 }
      used_in: [lesson_planning, base_material]
    - id: m.textrezeption.3
      text: "zunehmend unbekannte Lexik aus dem Kontext erschließen"
      source: { doc: lehrplan-2019, location: l207 }
      used_in: [lesson_planning, base_material]
    - id: m.textrezeption.4
      text: "den hybriden Charakter von digitalen Texten erkennen"
      source: { doc: lehrplan-2019, location: l207 }
      used_in: [lesson_planning, base_material]
    - id: m.textproduktion.1
      text: "mit Wortschatzsammlungen und anderen Hilfsmitteln umgehen"
      source: { doc: lehrplan-2019, location: l208 }
      used_in: [lesson_planning, base_material]
    - id: m.textproduktion.2
      text: "Texte schreiben, ergänzen und umgestalten, ggf. mit digitalen Hilfsmitteln"
      source: { doc: lehrplan-2019, location: l208 }
      used_in: [lesson_planning, base_material]
    - id: m.textproduktion.3
      text: "ansatzweise unbekannte Lexik umschreiben"
      source: { doc: lehrplan-2019, location: l208 }
      used_in: [lesson_planning, base_material]
    - id: m.textproduktion.4
      text: "mit Hilfen wesentliche Gedanken von gehörten oder gelesenen Vorgaben durch Notieren von Stichworten festhalten (note-taking)"
      source: { doc: lehrplan-2019, location: l208 }
      used_in: [lesson_planning, base_material]
    - id: m.interaktion.1
      text: "auf classroom phrases reagieren und diese anwenden"
      source: { doc: lehrplan-2019, location: l209 }
      used_in: [lesson_planning, base_material]
    - id: m.interaktion.2
      text: "sich in der Klasse, in der Gruppe und mit dem Partner in der Fremdsprache verständigen und einen einfachen Dialog aufrechterhalten"
      source: { doc: lehrplan-2019, location: l209 }
      used_in: [lesson_planning, base_material]
    - id: m.interaktion.3
      text: "digitale Wege und Werkzeuge unter Anleitung in einfachen Kommunikationssituationen nutzen"
      source: { doc: lehrplan-2019, location: l209 }
      used_in: [lesson_planning, base_material]
    - id: m.interaktion.4
      text: "Kommunikationssituationen mithilfe von digitalen Werkzeugen und Endgeräten simulieren"
      source: { doc: lehrplan-2019, location: l209 }
      used_in: [lesson_planning, base_material]
    - id: m.interaktion.5
      text: "mit persönlichen Daten (u. a. Adressen, Fotos) in digitalen Umgebungen zunehmend verantwortungsbewusst umgehen"
      source: { doc: lehrplan-2019, location: l209 }
      used_in: [lesson_planning, base_material]
    - id: m.praesentation.1
      text: "Visualisierungstechniken (z. B. illustrating, mind-mapping) anwenden"
      source: { doc: lehrplan-2019, location: l210 }
      used_in: [lesson_planning, base_material]
    - id: m.praesentation.2
      text: "bei der Nutzung von digitalen Inhalten das Recht an Bild und Text anwenden"
      source: { doc: lehrplan-2019, location: l210 }
      used_in: [lesson_planning, base_material]
    - id: m.praesentation.3
      text: "Internetquellen in einfacher Form angeben"
      source: { doc: lehrplan-2019, location: l210 }
      used_in: [lesson_planning, base_material]
    - id: m.praesentation.4
      text: "Hard- und Software unter Anleitung funktional aufgabenbezogen nutzen"
      source: { doc: lehrplan-2019, location: l210 }
      used_in: [lesson_planning, base_material]
    - id: m.praesentation.5
      text: "Arbeitsergebnisse über verschiedene Medien (z. B. Poster, Fotos, Erklärvideos) präsentieren"
      source: { doc: lehrplan-2019, location: l210 }
      used_in: [lesson_planning, base_material]
    - id: m.praesentation.6
      text: "auditive und visuelle Medien und/oder Lernprogramme nutzen"
      source: { doc: lehrplan-2019, location: l210 }
      used_in: [lesson_planning, base_material]
    - id: m.lernstrategien.1
      text: "mit Wortschatzsammlungen und ansatzweise mit zweisprachigen, auch digitalen Wörterbüchern umgehen und deren Möglichkeiten nutzen"
      source: { doc: lehrplan-2019, location: l211 }
      used_in: [lesson_planning, base_material]
    - id: m.lernstrategien.2
      text: "Verfahren, auch digitale, zur Vernetzung (z. B. Mindmap), Strukturierung (z. B. Wortfelder) und Speicherung (z. B. Wortkarteien) von sprachlichen Inputs anwenden und auf andere Kontexte transferieren"
      source: { doc: lehrplan-2019, location: l211 }
      used_in: [lesson_planning, base_material]
    - id: m.lernstrategien.3
      text: "Strategien zum Nachfragen und zum Ausgleich von Wissenslücken sinnvoll einsetzen"
      source: { doc: lehrplan-2019, location: l211 }
      used_in: [lesson_planning, base_material]
    - id: m.lernorganisation.1
      text: "sich in Partner- und Gruppenarbeit selbstständig über die Rollenverteilung verständigen und längere Zeit zusammenarbeiten"
      source: { doc: lehrplan-2019, location: l212 }
      used_in: [lesson_planning, base_material]
    - id: m.lernorganisation.2
      text: "den eigenen sprachlichen Fortschritt ggf. durch die Nutzung eines (digitalen) Portfolios oder von Sprachlernsoftware mit Hilfestellung einschätzen und dokumentieren"
      source: { doc: lehrplan-2019, location: l212 }
      used_in: [lesson_planning, base_material]
