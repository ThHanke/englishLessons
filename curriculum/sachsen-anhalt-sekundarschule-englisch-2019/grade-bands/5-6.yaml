id: sa-sek-en-2019.5-6
grades: [5, 6]
cefr_target: A1-A2
competence_areas:
  funktional_kommunikativ:
    kommunikativ:
      - id: fk.k.hoer.1
        skill_area: listening
        statement: "einfache Äußerungen, Arbeitsanweisungen und Aufgabenstellungen verstehen, die auf bekanntem Wortschatz aufbauen"
        mode: [understand]
        source: { doc: lehrplan-2019, location: l157 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.hoer.2
        skill_area: listening
        statement: "die Hauptgedanken von Hörtexten erfassen, die Aussagen aus dem persönlichen Erfahrungsfeld beinhalten"
        mode: [understand]
        source: { doc: lehrplan-2019, location: l157 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.hoer.3
        skill_area: listening
        statement: "einfachen Gesprächen folgen, in denen in Standardsprache über vertraute Inhalte gesprochen wird"
        mode: [understand]
        source: { doc: lehrplan-2019, location: l157 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.hoer.4
        skill_area: listening
        statement: "Details in didaktisch aufbereiteten Gesprächen/Hörtexten/Filmsequenzen erfassen, die langsam und deutlich mit weitestgehend geläufigem Wortschatz in einfacher Standardsprache dargeboten bzw. über visuelle Hilfen rezipierbar sind"
        mode: [understand]
        source: { doc: lehrplan-2019, location: l157 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.hoer.5
        skill_area: listening
        statement: "durch Erkennen von Intonationsmustern unterschiedliche Sprechabsichten unterscheiden"
        mode: [understand]
        source: { doc: lehrplan-2019, location: l157 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.lesen.1
        skill_area: reading
        statement: "einfache Texte, die sich auf vertraute Bereiche der Alltagskommunikation beziehen und zum Teil bildlich unterstützt werden, global und detailliert verstehen"
        mode: [understand]
        source: { doc: lehrplan-2019, location: l158 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.lesen.2
        skill_area: reading
        statement: "einfachen Texten Einzelinformationen entnehmen"
        mode: [understand]
        source: { doc: lehrplan-2019, location: l158 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.lesen.3
        skill_area: reading
        statement: "einfache kurze Texte sinngestaltend und deutlich artikuliert vorlesen"
        mode: [produce]
        source: { doc: lehrplan-2019, location: l158 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.lesen.4
        skill_area: reading
        statement: "Arbeitsanweisungen und Aufgabenstellungen verstehen"
        mode: [understand]
        source: { doc: lehrplan-2019, location: l158 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.sprechen.1
        skill_area: speaking
        statement: "sich in einfachen standardsprachlichen Kommunikationssituationen, die die Erfahrungswelt der Schüler betreffen, verständigen, wenn die Gesprächspartner langsam und deutlich sprechen"
        mode: [produce]
        source: { doc: lehrplan-2019, location: l159 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.sprechen.2
        skill_area: speaking
        statement: "Auskunft über einfache Alltagsthemen geben und einholen"
        mode: [produce]
        source: { doc: lehrplan-2019, location: l159 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.sprechen.3
        skill_area: speaking
        statement: "nach Vorbereitung und unter Nutzung sprachlicher und nichtsprachlicher Hilfen in einfacher Form zusammenhängend erzählen, berichten und beschreiben"
        mode: [produce]
        source: { doc: lehrplan-2019, location: l159 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.sprechen.4
        skill_area: speaking
        statement: "alterstypische Texte (z. B. Rollenspiel, Gedicht und Lied) auswendig, intonatorisch richtig und ausdrucksvoll vortragen"
        mode: [produce]
        source: { doc: lehrplan-2019, location: l159 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.sprechen.5
        skill_area: speaking
        statement: "einfache Aussagen zu Gehörtem, Gelesenem sowie zu Bildinhalten machen"
        mode: [produce]
        source: { doc: lehrplan-2019, location: l159 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.schreiben.1
        skill_area: writing
        statement: "Wörter, Wortgruppen und kurze Texte, die aus bekanntem Wortschatz bestehen, regelgerecht schreiben"
        mode: [produce]
        source: { doc: lehrplan-2019, location: l160 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.schreiben.2
        skill_area: writing
        statement: "kurze einfache Texte, die sich auf Sachverhalte des persönlichen Erfahrungsfeldes beziehen, weitgehend sprachlich korrekt sowohl nach Vorgaben als auch frei verfassen"
        mode: [produce]
        source: { doc: lehrplan-2019, location: l160 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.sprachmittlung.1
        skill_area: mediation
        statement: "in einfachen und vertrauten Alltagssituationen Äußerungen in deutscher Sprache wiedergeben, so dass ein allgemeines Verständnis gesichert ist; in simulierten Situationen und in einfachen Rollenspielen Einzelsätze verstehen und das Wichtigste in deutscher oder englischer Sprache wiedergeben bzw. erklären"
        mode: [produce]
        source: { doc: lehrplan-2019, location: l161 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.sprachmittlung.2
        skill_area: mediation
        statement: "einfache Informationen mit einfachen sprachlichen Mitteln in der jeweils anderen Sprache kurz zusammenfassen"
        mode: [produce]
        source: { doc: lehrplan-2019, location: l161 }
        used_in: [module_construction, lesson_planning, test_generation]
