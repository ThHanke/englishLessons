        used_in: [module_construction, lesson_planning]
      - id: ik.a.readiness
        skill_area: intercultural
        statement: "Bereitschaft entwickeln, sich auf fremde Situationen einzustellen und sich im Alltag angemessen zu verhalten"
        mode: [produce]
        source: { doc: lehrplan-2019, location: l192 }
        used_in: [module_construction, lesson_planning]
      - id: ik.a.apply_orientation_knowledge
