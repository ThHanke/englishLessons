        used_in: [module_construction, lesson_planning]
      - id: ik.a.communicate_appropriately
        skill_area: intercultural
        statement: "altersgemäß entsprechend den Inhalten aus den genannten Kompetenzbereichen, auch im virtuellen Raum, kommunizieren"
        mode: [produce]
        source: { doc: lehrplan-2019, location: l193 }
        used_in: [module_construction, lesson_planning]
