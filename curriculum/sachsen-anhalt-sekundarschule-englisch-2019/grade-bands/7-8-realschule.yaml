id: sa-sek-en-2019.7-8.rs
grades: [7, 8]
track: realschulabschluss
cefr_target: B1
competence_areas:
  funktional_kommunikativ:
    kommunikativ:
      - id: fk.k.hoer.1
        skill_area: listening
        statement: "einfache und komplexere Äußerungen und Aufgabenstellungen verstehen, die auf bekanntem bzw. erschließbarem Wortschatz aufbauen"
        mode: [understand]
        source: { doc: lehrplan-2019, location: l230 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.hoer.2
        skill_area: listening
        statement: "die Hauptgedanken von Hörtexten erfassen, deren Inhalte auch über den persönlichen Erfahrungsbereich hinausgehen"
        mode: [understand]
        source: { doc: lehrplan-2019, location: l230 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.hoer.3
        skill_area: listening
        statement: "zunehmend komplexeren Gesprächen in vertrauten Sprachvarianten (BE, AE) und authentischen Hörsituationen folgen"
        mode: [understand]
        source: { doc: lehrplan-2019, location: l230 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.hoer.4
        skill_area: listening
        statement: "Details in komplexeren Gesprächen/Hörtexten sowie Filmsequenzen erfassen, die deutlich und in normalem Tempo mit zunehmend unbekanntem Wortschatz in verschiedenen Sprachvarianten (BE, AE) gesprochen werden"
        mode: [understand]
        source: { doc: lehrplan-2019, location: l230 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.lesen.1
        skill_area: reading
        statement: "die Hauptaspekte einfacher, authentischer sowohl fiktionaler als auch nichtfiktionaler Texte zu vertrauten, altersgemäßen Bereichen verstehen und weitgehend eigenständig Gesamtzusammenhänge erschließen"
        mode: [understand]
        source: { doc: lehrplan-2019, location: l231 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.lesen.2
        skill_area: reading
        statement: "Informationen aus Texten entnehmen"
        mode: [understand]
        source: { doc: lehrplan-2019, location: l231 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.lesen.3
        skill_area: reading
        statement: "Texte unter bestimmten Fragestellungen untersuchen und die Struktur erfassen"
        mode: [understand]
        source: { doc: lehrplan-2019, location: l231 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.lesen.4
        skill_area: reading
        statement: "Texte (z. B. Sketch und Dialog) sinngestaltend (flüssig, artikuliert und phonetisch richtig) vorlesen"
        mode: [produce]
        source: { doc: lehrplan-2019, location: l231 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.sprechen.1
        skill_area: speaking
        statement: "sich in gängigen standardsprachlichen Kommunikationssituationen, die überwiegend die Erfahrungswelt der Schüler betreffen, verständigen, wenn die Gesprächspartner deutlich sprechen"
        mode: [produce]
        source: { doc: lehrplan-2019, location: l232 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.sprechen.2
        skill_area: speaking
        statement: "Auskünfte über Alltagsthemen geben und einholen"
        mode: [produce]
        source: { doc: lehrplan-2019, location: l232 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.sprechen.3
        skill_area: speaking
        statement: "zu vertrauten Themen und unter Nutzung sprachlicher und nichtsprachlicher Mittel zusammenhängend und zunehmend differenziert erzählen, berichten, beschreiben sowie Wortgruppen und Sätze durch einfache Konnektoren (z. B. and, but, because) verknüpfen"
        mode: [produce]
        source: { doc: lehrplan-2019, location: l232 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.sprechen.4
        skill_area: speaking
        statement: "eigene Standpunkte altersgemäß darlegen und begründen"
        mode: [produce]
        source: { doc: lehrplan-2019, location: l232 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.sprechen.5
        skill_area: speaking
        statement: "wesentliche Inhalte von Gehörtem und Gelesenem zusammenfassen sowie zunehmend detaillierte Aussagen zu Bildinhalten machen"
        mode: [produce]
        source: { doc: lehrplan-2019, location: l232 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.sprechen.6
        skill_area: speaking
        statement: "Texte (z. B. Rollenspiel, Lied oder Gedicht) auswendig und gestaltend vortragen"
        mode: [produce]
        source: { doc: lehrplan-2019, location: l232 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.schreiben.1
        skill_area: writing
        statement: "Wörter, Wortgruppen, Sätze und kurze Texte, die auf bekanntem Sprachmaterial aufbauen, weitgehend strukturiert und sprachlich richtig verfassen"
        mode: [produce]
        source: { doc: lehrplan-2019, location: l233 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.schreiben.2
        skill_area: writing
        statement: "Textsorten nach Vorgaben adressaten- und situationsgerecht in einfacher Form und sprachlich korrekt verfassen"
        mode: [produce]
        source: { doc: lehrplan-2019, location: l233 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.schreiben.3
        skill_area: writing
        statement: "Texte ggf. auch mediengestützt verändern, zusammenfassen und weiterschreiben"
        mode: [produce]
        source: { doc: lehrplan-2019, location: l233 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.sprachmittlung.1
        skill_area: mediation
        statement: "kurze und einfache sprachlich gesicherte Äußerungen vorwiegend mündlich in die andere Sprache übertragen"
        mode: [produce]
        source: { doc: lehrplan-2019, location: l234 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.sprachmittlung.2
        skill_area: mediation
        statement: "die Hauptaussage kurzer Gebrauchstexte erschließen und in der jeweils anderen Sprache wiedergeben"
        mode: [produce]
        source: { doc: lehrplan-2019, location: l234 }
        used_in: [module_construction, lesson_planning, test_generation]
      - id: fk.k.sprachmittlung.3
        skill_area: mediation
        statement: "in einfachen Alltagssituationen mündliche und schriftliche Äußerungen in vertrauten thematischen Zusammenhängen in der jeweils anderen Sprache so wiedergeben, dass allgemeines Verständnis gesichert ist"
        mode: [produce]
        source: { doc: lehrplan-2019, location: l234 }
        used_in: [module_construction, lesson_planning, test_generation]
