        source: { doc: lehrplan-2019, location: l272 }
        used_in: [module_construction, lesson_planning]
  methodisch:
    - id: m.textrezeption.1
      text: "weitere Texterschließungsstrategien (z. B. skimming, scanning, structuring) anwenden"
      source: { doc: lehrplan-2019, location: l278 }
      used_in: [lesson_planning, base_material]
    - id: m.textrezeption.2
      text: "unbekannte Lexik erschließen (aus dem Kontext, mithilfe der zweiten Fremdsprache oder der Muttersprache bzw. durch Wortbildungsmuster, Internationalismen)"
      source: { doc: lehrplan-2019, location: l278 }
      used_in: [lesson_planning, base_material]
    - id: m.textrezeption.3
      text: "konventionalisierte, kulturspezifisch geprägte Charakteristika von Textsorten kennen"
      source: { doc: lehrplan-2019, location: l278 }
      used_in: [lesson_planning, base_material]
    - id: m.textrezeption.4
      text: "den hybriden Charakter von digitalen Texten unter Anleitung nutzen"
      source: { doc: lehrplan-2019, location: l278 }
      used_in: [lesson_planning, base_material]
    - id: m.textproduktion.1
      text: "Technik des note-taking ausbauen"
      source: { doc: lehrplan-2019, location: l279 }
      used_in: [lesson_planning, base_material]
    - id: m.textproduktion.2
      text: "Technik des note-making (sammeln, sichten, ordnen, gliedern), ggf. mit digitalen Werkzeugen, anwenden"
      source: { doc: lehrplan-2019, location: l279 }
      used_in: [lesson_planning, base_material]
    - id: m.textproduktion.3
      text: "einfache Strukturen der Meinungsäußerung anwenden"
      source: { doc: lehrplan-2019, location: l279 }
      used_in: [lesson_planning, base_material]
    - id: m.interaktion.1
      text: "mit Partner und in der Gruppe arbeiten"
      source: { doc: lehrplan-2019, location: l280 }
      used_in: [lesson_planning, base_material]
    - id: m.interaktion.2
      text: "situationsangemessen und spontan auf Kommunikationspartner reagieren und Gespräche initiieren"
      source: { doc: lehrplan-2019, location: l280 }
      used_in: [lesson_planning, base_material]
    - id: m.interaktion.3
      text: "Chatregeln kennen und beachten"
      source: { doc: lehrplan-2019, location: l280 }
      used_in: [lesson_planning, base_material]
    - id: m.interaktion.4
      text: "digitale Medien und Werkzeuge unter Berücksichtigung von Risiken und Gefahren in vertrauten Kommunikationssituationen nutzen"
      source: { doc: lehrplan-2019, location: l280 }
      used_in: [lesson_planning, base_material]
    - id: m.interaktion.5
      text: "mit persönlichen Daten (u. a. Adressen, Fotos) in digitalen Umgebungen verantwortungsbewusst umgehen"
      source: { doc: lehrplan-2019, location: l280 }
      used_in: [lesson_planning, base_material]
    - id: m.praesentation.1
      text: "Hilfsmittel wie Wörterbücher, auch digitale, Lernprogramme und Internet nutzen"
      source: { doc: lehrplan-2019, location: l281 }
      used_in: [lesson_planning, base_material]
    - id: m.praesentation.2
      text: "Hard- und Software zunehmend selbstständig funktional aufgabenbezogen nutzen"
      source: { doc: lehrplan-2019, location: l281 }
      used_in: [lesson_planning, base_material]
    - id: m.praesentation.3
      text: "auftretende Probleme im Umgang mit digitalen Werkzeugen und Medien unter Anleitung lösen"
      source: { doc: lehrplan-2019, location: l281 }
      used_in: [lesson_planning, base_material]
    - id: m.praesentation.4
      text: "multimediale Präsentationsmittel nutzen"
      source: { doc: lehrplan-2019, location: l281 }
      used_in: [lesson_planning, base_material]
    - id: m.praesentation.5
      text: "zu einem unterrichtsbezogenen Thema Informationen und Medien (z. B. Texte, Bilder, Grafiken, Videos, Audios) recherchieren und unter Berücksichtigung rechtlicher Vorgaben digital weiterverarbeiten"
      source: { doc: lehrplan-2019, location: l281 }
      used_in: [lesson_planning, base_material]
    - id: m.praesentation.6
      text: "moderne Medien zur Informationsbeschaffung, zur kommunikativen Interaktion und zur Präsentation der Ergebnisse unter Anleitung nutzen sowie analoge und digitale Quellen exakt angeben"
      source: { doc: lehrplan-2019, location: l281 }
      used_in: [lesson_planning, base_material]
    - id: m.lernstrategien.1
      text: "Techniken des Wortschatzerwerbs und der Wortschatzerweiterung (Umschreiben von unbekannten Wörtern, Wortableitungen, Wortfamilien, Synonyme, Antonyme) anwenden"
      source: { doc: lehrplan-2019, location: l282 }
      used_in: [lesson_planning, base_material]
    - id: m.lernstrategien.2
      text: "Mnemotechniken aneignen und anwenden"
      source: { doc: lehrplan-2019, location: l282 }
      used_in: [lesson_planning, base_material]
    - id: m.lernstrategien.3
      text: "Korrektur lesen"
      source: { doc: lehrplan-2019, location: l282 }
      used_in: [lesson_planning, base_material]
    - id: m.lernstrategien.4
      text: "weitgehend sicher mit Wortschatzsammlungen und zweisprachigen, auch digitalen Wörterbüchern umgehen"
      source: { doc: lehrplan-2019, location: l282 }
      used_in: [lesson_planning, base_material]
    - id: m.lernorganisation.1
      text: "Partner- und Gruppenarbeit organisieren und dabei mithilfe der Zielbeschreibung über die Rollenverteilung, den Ablauf und die Präsentationsformen entscheiden"
      source: { doc: lehrplan-2019, location: l283 }
      used_in: [lesson_planning, base_material]
    - id: m.lernorganisation.2
      text: "den eigenen Lernfortschritt ggf. unter Zuhilfenahme von digitalen Werkzeugen zunehmend selbst einschätzen und dies dokumentieren"
      source: { doc: lehrplan-2019, location: l283 }
      used_in: [lesson_planning, base_material]
