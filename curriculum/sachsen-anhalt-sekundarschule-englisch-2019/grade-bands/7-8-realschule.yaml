        statement: "sich eigene und fremde Verhaltens- und Lebensweisen bewusst machen"
        mode: [understand]
        source: { doc: lehrplan-2019, location: l263 }
        used_in: [module_construction, lesson_planning]
      - id: ik.a.engage_with_cultural_values
        skill_area: intercultural
        statement: "sich mit eigenen und anderen kulturellen Werten auseinandersetzen"
        mode: [produce]
        source: { doc: lehrplan-2019, location: l263 }
        used_in: [module_construction, lesson_planning]
      - id: ik.a.behave_communicate_cooperate
        skill_area: intercultural
        statement: "sich in Begegnungs- und Alltagssituationen angemessen verhalten, miteinander kommunizieren und kooperieren"
        mode: [produce]
        source: { doc: lehrplan-2019, location: l264 }
        used_in: [module_construction, lesson_planning]
      - id: ik.a.use_evaluate_communication_platforms
        skill_area: intercultural
        statement: "Interaktionsmöglichkeiten von Kommunikationsplattformen unter Anleitung angemessen nutzen und bewerten"
        mode: [produce]
        source: { doc: lehrplan-2019, location: l264 }
        used_in: [module_construction, lesson_planning]
    orientierungswissen:
