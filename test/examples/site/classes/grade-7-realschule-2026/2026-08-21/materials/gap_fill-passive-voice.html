<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Passive Voice: Everyday Routines</title>
<style>
  body { font-family: sans-serif; max-width: 40rem; margin: 2rem auto; }
  input { border: 1px solid #888; padding: 0.2rem 0.4rem; }
  input.correct { background: #d4f7d4; border-color: #2a2; }
  input.incorrect { background: #f7d4d4; border-color: #a22; }
  button { margin-top: 1rem; }
</style>
</head>
<body>
<h1>Passive Voice: Everyday Routines</h1>
<p class="sentence" data-item="0">The classroom <input type="text" data-item="0" data-blank="0" autocomplete="off"> every morning by the caretaker.</p>
<p class="sentence" data-item="1">Our books <input type="text" data-item="1" data-blank="0" autocomplete="off"> from the library last week.</p>
<p class="sentence" data-item="2">This exercise <input type="text" data-item="2" data-blank="0" autocomplete="off"> by all students tomorrow.</p>
<button id="check">Check</button>
<script>
(function () {
  var answers = [["is cleaned"],["were borrowed"],["will be finished"]];
  function normalize(s) { return s.trim().toLowerCase(); }
  document.getElementById('check').addEventListener('click', function () {
    var inputs = document.querySelectorAll('input[data-item]');
    inputs.forEach(function (input) {
      var ii = Number(input.getAttribute('data-item'));
      var bi = Number(input.getAttribute('data-blank'));
      var value = input.value.trim();
      input.classList.remove('correct', 'incorrect');
      if (value.length === 0) return;
      if (normalize(value) === normalize(answers[ii][bi])) {
        input.classList.add('correct');
      } else {
        input.classList.add('incorrect');
      }
    });
  });
})();
</script>
</body>
</html>
