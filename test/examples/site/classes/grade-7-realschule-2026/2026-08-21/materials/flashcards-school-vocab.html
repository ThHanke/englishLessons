<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>School Vocab Flashcards</title>
<style>
  body { font-family: sans-serif; max-width: 40rem; margin: 2rem auto; color: #111; }
  .deck { display: flex; flex-direction: column; gap: 1rem; }
  .card { border: 1px solid #ccc; border-radius: 0.5rem; padding: 1rem; text-align: center; }
  button.flip { width: 100%; min-height: 4rem; font: inherit; font-size: 1.1rem; cursor: pointer;
    border: 1px solid #888; border-radius: 0.4rem; background: #fff; padding: 1rem; }
  .face.back { display: none; color: #06c; }
  .card[data-state="back"] .face.front { display: none; }
  .card[data-state="back"] .face.back { display: inline; }
  .rate { margin-top: 0.6rem; display: flex; gap: 0.5rem; justify-content: center; }
  .rated { margin-top: 0.6rem; font-weight: bold; }
  p#summary { font-weight: bold; margin-top: 1.5rem; }
</style>
</head>
<body>
<h1>School Vocab Flashcards</h1>
<p>Click a card to reveal the answer, then rate yourself.</p>
<div class="deck">
    <div class="card" data-card="0" data-state="front">
      <button type="button" class="flip" data-card="0">
        <span class="face front">timetable</span>
        <span class="face back">Stundenplan</span>
      </button>
      <div class="rate" data-rate="0" hidden>
        <button type="button" class="know" data-card="0">Got it</button>
        <button type="button" class="learning" data-card="0">Still learning</button>
      </div>
      <p class="rated" data-rated="0" hidden></p>
    </div>
    <div class="card" data-card="1" data-state="front">
      <button type="button" class="flip" data-card="1">
        <span class="face front">homework</span>
        <span class="face back">Hausaufgabe</span>
      </button>
      <div class="rate" data-rate="1" hidden>
        <button type="button" class="know" data-card="1">Got it</button>
        <button type="button" class="learning" data-card="1">Still learning</button>
      </div>
      <p class="rated" data-rated="1" hidden></p>
    </div>
    <div class="card" data-card="2" data-state="front">
      <button type="button" class="flip" data-card="2">
        <span class="face front">caretaker</span>
        <span class="face back">Hausmeister</span>
      </button>
      <div class="rate" data-rate="2" hidden>
        <button type="button" class="know" data-card="2">Got it</button>
        <button type="button" class="learning" data-card="2">Still learning</button>
      </div>
      <p class="rated" data-rated="2" hidden></p>
    </div></div>
<p id="summary"></p>
<script>
(function () {
  var total = 3;
  var rated = {};

  document.querySelectorAll('button.flip').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var i = btn.getAttribute('data-card');
      var card = document.querySelector('.card[data-card="' + i + '"]');
      var isBack = card.getAttribute('data-state') === 'back';
      card.setAttribute('data-state', isBack ? 'front' : 'back');
      var rateEl = document.querySelector('.rate[data-rate="' + i + '"]');
      if (!isBack) rateEl.hidden = false;
    });
  });

  function updateSummary() {
    var known = 0;
    var seen = 0;
    for (var k in rated) {
      seen++;
      if (rated[k] === 'know') known++;
    }
    document.getElementById('summary').textContent =
      seen === 0 ? '' : known + ' / ' + seen + ' known so far (' + total + ' cards total)';
  }

  document.querySelectorAll('button.know, button.learning').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var i = btn.getAttribute('data-card');
      var rating = btn.classList.contains('know') ? 'know' : 'learning';
      rated[i] = rating;
      var ratedEl = document.querySelector('[data-rated="' + i + '"]');
      ratedEl.hidden = false;
      ratedEl.textContent = rating === 'know' ? 'Marked: Got it' : 'Marked: Still learning';
      updateSummary();
    });
  });
})();
</script>
</body>
</html>
