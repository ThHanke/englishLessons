<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Key Words: Passive Voice and Media</title>
<style>
  body { font-family: sans-serif; max-width: 40rem; margin: 2rem auto; }
  table.vocab { border-collapse: collapse; width: 100%; }
  table.vocab th, table.vocab td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left; }
  button.speak { border: 1px solid #888; border-radius: 0.3rem; background: #fff; cursor: pointer; font-size: 1rem; }
  button.speak:disabled { opacity: 0.4; cursor: not-allowed; }
  .no-words { color: #666; font-style: italic; }
</style>
</head>
<body>
<h1>Key Words: Passive Voice and Media</h1>
<table class="vocab">
<thead><tr><th>Word</th><th>Translation</th><th></th></tr></thead>
<tbody>
<tr>
  <td>advertisement</td>
  <td>die Werbung</td>
  <td><button type="button" class="speak" data-word="advertisement" aria-label="Read aloud: advertisement">&#128266;</button></td>
</tr>
<tr>
  <td>headteacher</td>
  <td>der Schulleiter / die Schulleiterin</td>
  <td><button type="button" class="speak" data-word="headteacher" aria-label="Read aloud: headteacher">&#128266;</button></td>
</tr>
<tr>
  <td>content</td>
  <td>der Inhalt</td>
  <td><button type="button" class="speak" data-word="content" aria-label="Read aloud: content">&#128266;</button></td>
</tr>
<tr>
  <td>produce</td>
  <td>produzieren / herstellen</td>
  <td><button type="button" class="speak" data-word="produce" aria-label="Read aloud: produce">&#128266;</button></td>
</tr>
<tr>
  <td>publish</td>
  <td>veröffentlichen</td>
  <td><button type="button" class="speak" data-word="publish" aria-label="Read aloud: publish">&#128266;</button></td>
</tr>
<tr>
  <td>passive voice</td>
  <td>das Passiv (Grammatikform)</td>
  <td><button type="button" class="speak" data-word="passive voice" aria-label="Read aloud: passive voice">&#128266;</button></td>
</tr>
<tr>
  <td>active voice</td>
  <td>das Aktiv (Grammatikform)</td>
  <td><button type="button" class="speak" data-word="active voice" aria-label="Read aloud: active voice">&#128266;</button></td>
</tr>
</tbody>
</table>
<script>
(function () {
  var supported = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
  document.querySelectorAll('button.speak').forEach(function (btn) {
    if (!supported) {
      btn.disabled = true;
      btn.title = 'Read-aloud not supported in this browser';
      return;
    }
    btn.addEventListener('click', function () {
      var utterance = new SpeechSynthesisUtterance(btn.getAttribute('data-word'));
      utterance.lang = 'en-GB';
      window.speechSynthesis.speak(utterance);
    });
  });
})();
</script>
</body>
</html>
