class: grade-6-2027
curriculum: sa-sek-en-2019.5-6
total_weeks: 40
weekly_lessons: 4
buffer_weeks: 4
modules:
  - id: m1
    title: "Yesterday and daily routines"
    weeks: 12
    content_fields: [c.alltag.dienstleistung_tagesablauf]
    goals:
      - "Narrate past events using the simple past"
      - "Describe daily routines and service interactions"
    covers:
      - { id: fk.g.simple_past, required_depth: produce }
      - { id: fk.g.prepositions, required_depth: produce }
      - { id: fk.w.express_feelings, required_depth: produce }
      - { id: fk.k.hoer.3, required_depth: understand }
      - { id: fk.k.lesen.2, required_depth: understand }
      - { id: fk.k.sprechen.3, required_depth: produce }
      - { id: fk.k.schreiben.2, required_depth: produce }
    milestone:
      type: test
      assesses: [fk.g.simple_past]
    pedagogy:
      new_grammar: [fk.g.simple_past, fk.g.prepositions]
  - id: m2
    title: "Future plans and the weather"
    weeks: 12
    content_fields: [c.natur.wetter]
    goals:
      - "Talk about future plans and predictions"
      - "Describe the weather and make comparisons"
    covers:
      - { id: fk.g.going_to_future, required_depth: produce }
      - { id: fk.g.will_future, required_depth: produce }
      - { id: fk.g.adjectives_comparison, required_depth: produce }
      - { id: fk.k.hoer.4, required_depth: understand }
      - { id: fk.k.sprechen.4, required_depth: produce }
      - { id: fk.a.intonation_patterns, required_depth: produce }
    milestone:
      type: test
      assesses: [fk.g.going_to_future, fk.g.will_future]
    pedagogy:
      new_grammar: [fk.g.going_to_future, fk.g.will_future, fk.g.adjectives_comparison]
  - id: m3
    title: "What has changed — the UK"
    weeks: 12
    content_fields: [c.alltag.dienstleistung_tagesablauf]
    goals:
      - "Recognise the present perfect for change up to now"
      - "Describe possession with the genitive"
      - "Explore everyday life and culture in the UK"
    covers:
      - { id: fk.g.present_perfect, required_depth: understand }
      - { id: fk.g.genitive, required_depth: produce }
      - { id: fk.w.media_vocabulary, required_depth: produce }
      - { id: fk.k.hoer.5, required_depth: understand }
      - { id: fk.k.lesen.3, required_depth: produce }
      - { id: fk.k.sprechen.5, required_depth: produce }
      - { id: fk.k.sprachmittlung.2, required_depth: produce }
      - { id: fk.o.free_writing, required_depth: produce }
      - { id: fk.o.proofread, required_depth: produce }
      - { id: ik.a.readiness, required_depth: produce }
      - { id: ik.a.apply_orientation_knowledge, required_depth: produce }
      - { id: ik.a.communicate_appropriately, required_depth: produce }
      - { id: ik.o.geografie_uk, required_depth: understand }
      - { id: ik.o.gesellschaft, required_depth: understand }
      - { id: m.textrezeption.2, required_depth: understand }
      - { id: m.textrezeption.3, required_depth: understand }
      - { id: m.textrezeption.4, required_depth: understand }
      - { id: m.textproduktion.1, required_depth: produce }
      - { id: m.textproduktion.2, required_depth: produce }
      - { id: m.textproduktion.3, required_depth: produce }
      - { id: m.textproduktion.4, required_depth: produce }
      - { id: m.interaktion.2, required_depth: produce }
      - { id: m.interaktion.3, required_depth: produce }
      - { id: m.interaktion.4, required_depth: produce }
      - { id: m.interaktion.5, required_depth: produce }
      - { id: m.praesentation.1, required_depth: produce }
      - { id: m.praesentation.2, required_depth: produce }
      - { id: m.praesentation.3, required_depth: produce }
      - { id: m.praesentation.4, required_depth: produce }
      - { id: m.praesentation.5, required_depth: produce }
      - { id: m.praesentation.6, required_depth: produce }
      - { id: m.lernstrategien.2, required_depth: produce }
      - { id: m.lernstrategien.3, required_depth: produce }
      - { id: m.lernorganisation.1, required_depth: produce }
      - { id: m.lernorganisation.2, required_depth: produce }
    milestone:
      type: test
      assesses: [fk.g.genitive]
    pedagogy:
      new_grammar: [fk.g.present_perfect, fk.g.genitive]
